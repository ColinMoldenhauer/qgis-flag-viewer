name: Release

# Fires on any pushed version tag. Packaging/publishing a plugin version
# is a one-way, user-visible action, but a pushed tag is itself already
# the deliberate "this version is confirmed ready" signal, so there's no
# need for a separate publish-a-GitHub-Release step in between.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Tests are not repeated for the tag; package.yml ran them when the commit was
      # pushed to main. Wait for that run (it may still be in progress, or not exist
      # yet if the tag arrived first) and continue only if it passed.
      - name: Wait for the tests on main for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 12); do
            id=$(gh run list --workflow package.yml --branch main --event push               --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::No test run on main for $GITHUB_SHA. Push the commit to main before tagging it."
            exit 1
          fi
          gh run watch "$id" --interval 15 --exit-status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install qgis-plugin-ci
        run: pip install qgis-plugin-ci

      # qgis-plugin-ci's "release" command expects a GitHub Release to
      # already exist for this tag (it 404s otherwise) -- it doesn't
      # create one itself. Create it here so a tag push is still all it
      # takes; skip if a release for this tag already exists (e.g. a
      # re-run). GITHUB_TOKEN is provided automatically by Actions, no
      # repo secret to configure.
      - name: Ensure a GitHub release exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 ||
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}" --generate-notes

      # Builds the versioned zip and attaches it to the release above as
      # a downloadable asset.
      - name: Package and attach zip to the GitHub release
        run: >-
          qgis-plugin-ci release ${{ github.ref_name }}
          --github-token ${{ secrets.GITHUB_TOKEN }}

      # Publishing to the official plugins.qgis.org repository is a
      # separate, one-way public action. QGIS_TOKEN is the repo secret
      # holding the plugin API token generated on plugins.qgis.org.
      - name: Publish to plugins.qgis.org
        run: >-
          qgis-plugin-ci release ${{ github.ref_name }}
          --github-token ${{ secrets.GITHUB_TOKEN }}
          --qgis-token ${{ secrets.QGIS_TOKEN }}
